name: Bootstrap import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part* | base64 -d > /tmp/keiba.zip
          rm -rf /tmp/keiba-import
          mkdir -p /tmp/keiba-import
          unzip -q /tmp/keiba.zip -d /tmp/keiba-import
          test -f /tmp/keiba-import/Keiba-Games/.github/workflows/ios-ci.yml
          unzip -t /tmp/keiba.zip

      - name: Import repository contents
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/keiba-import/Keiba-Games/ ./
          test -f .github/workflows/ios-ci.yml
          test ! -d .bootstrap
          git status --short

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Keiba Games phase 1-2"
          git push
