name: iOS build and launch
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Apple toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Debug build
        run: |
          set -o pipefail
          mkdir -p evidence
          xcodebuild -project KawaiiRace.xcodeproj -scheme KawaiiRace -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee evidence/debug.log
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild -project KawaiiRace.xcodeproj -scheme KawaiiRace -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/release CODE_SIGNING_ALLOWED=NO build 2>&1 | tee evidence/release.log
      - name: Boot simulator and launch
        id: smoke
        run: bash scripts/launch-smoke.sh
      - name: Install minimal runtime control
        run: bash scripts/install-runtime-control.sh
      - name: Unit and full-loop UI tests
        run: |
          set -o pipefail
          SIM_ID=$(cat evidence/simulator-id)
          xcodebuild -project KawaiiRace.xcodeproj -scheme KawaiiRace -configuration Debug -destination "platform=iOS Simulator,id=$SIM_ID" -derivedDataPath build/debug -resultBundlePath evidence/tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee evidence/tests.log
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d evidence/tests.xcresult ]; then
            xcrun xcresulttool export attachments --path evidence/tests.xcresult --output-path evidence/ui-attachments
            xcrun xcresulttool get test-results summary --path evidence/tests.xcresult > evidence/test-summary.json
          fi
      - name: Record paddock and normal race
        if: ${{ always() && steps.smoke.outcome == 'success' }}
        run: bash scripts/record-video.sh
      - name: Preserve build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence
          path: |
            evidence/*.log
            evidence/*.png
            evidence/*.json
            evidence/*.txt
            evidence/*.ips
            evidence/*.crash
            evidence/simulator-id
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            evidence/ui-attachments/**/*.png
            evidence/ui-attachments/**/*.jpg
            evidence/ui-attachments/**/*.jpeg
            evidence/ui-attachments/**/*.json
            evidence/ui-attachments/**/*.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: evidence/tests.xcresult/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-videos
          path: evidence/*.mp4
