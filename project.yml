name: KawaiiRace
options:
  bundleIdPrefix: com.inari1234
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  KeibaCore:
    path: Packages/KeibaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KawaiiRace:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: KeibaCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: かわいい競馬
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inari1234.kawaiirace
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  KawaiiRaceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: KawaiiRace
      - package: KeibaCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KawaiiRace:
    build:
      targets:
        KawaiiRace: all
    test:
      targets: [KawaiiRaceTests]
